openapi: 3.1.0
info:
  title: Alpha Vault API
  version: 2.1.0
  description: |
    API panelu Alpha Vault. Uwierzytelnianie przez sesję w cookie HttpOnly
    ustawianą po logowaniu Discord OAuth2 lub w trybie demo.
    Stan aplikacji jest dokumentem JSON zapisywanym w MySQL z optymistyczną rewizją.
  contact:
    name: Alpha Moves
    url: https://www.alphamoves.pl
servers:
  - url: http://127.0.0.1:4173
    description: Lokalny
  - url: https://vault.alphamoves.pl
    description: Produkcja (przykład)
tags:
  - name: Auth
  - name: API
  - name: System

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check + MySQL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Baza niedostępna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/me:
    get:
      tags: [API]
      summary: Profil zalogowanego użytkownika lub stan anonimowy
      responses:
        '200':
          description: Zawsze 200; pole authenticated mówi o sesji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /api/state:
    get:
      tags: [API]
      summary: Pobierz stan użytkownika
      description: Historyczny mojibake (UTF-8 odczytany jako Windows-1250) jest naprawiany przed odpowiedzią i zapisywany z powrotem do MySQL bez zmiany rewizji. Poprawne znaki pozostają bez zmian.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Stan i rewizja
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [API]
      summary: Zapisz cały stan (optymistyczna rewizja)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatePutRequest'
      responses:
        '200':
          description: Zapisano
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Złe Origin (CSRF)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Konflikt rewizji albo stan z karty innego konta (session_changed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Stan za duży
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit
    delete:
      tags: [API]
      summary: Wyczyść stan (konto zostaje)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Wyczyszczono
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/connections:
    get:
      tags: [API]
      summary: Lista połączeń giełd/brokerów (bez sekretów)
      responses:
        '200':
          description: OK
        '401':
          description: Brak sesji
    post:
      tags: [API]
      summary: Dodaj klucz giełdy lub konto MetaTrader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, fields]
              properties:
                provider:
                  type: string
                  enum: [weex, okx, bingx, mt4, mt5]
                fields:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Połączono
        '422':
          description: Klucz niepoprawny lub (OKX/BingX) nie jest tylko do odczytu
  /api/connections/sync:
    post:
      tags: [API]
      summary: Synchronizuj wszystkie połączenia
      responses:
        '200':
          description: Podsumowanie synchronizacji
  /api/connections/{id}/sync:
    post:
      tags: [API]
      summary: Synchronizuj jedno połączenie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Podsumowanie synchronizacji
  /api/connections/{id}:
    delete:
      tags: [API]
      summary: Odłącz połączenie
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Usunięto
  /api/connections/mt/pair:
    post:
      tags: [API]
      summary: Wygeneruj kod parowania EA
      responses:
        '201':
          description: Kod AV-XXXX-XXXX
  /api/mt/ea:
    post:
      tags: [API]
      summary: Ingestion transakcji z Expert Advisor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, trades]
              properties:
                code:
                  type: string
                trades:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: Import zakończony
        '401':
          description: Zły kod parowania
  /api/me/export:
    get:
      tags: [API]
      summary: Eksport JSON (attachment)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Plik JSON
          content:
            application/json:
              schema:
                type: object
  /api/account:
    delete:
      tags: [API]
      summary: Usuń konto i wszystkie dane
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Usunięto
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/discord:
    get:
      tags: [Auth]
      summary: Start OAuth2 Discord
      parameters:
        - name: remember
          in: query
          schema:
            type: string
            enum: ['0', '1']
            default: '1'
      responses:
        '302':
          description: Przekierowanie do Discord
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          description: Brak konfiguracji Discord
  /auth/discord/callback:
    get:
      tags: [Auth]
      summary: Callback OAuth2 Discord
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Zalogowano, przekierowanie do UI
          headers:
            Set-Cookie:
              schema: { type: string }
        '400':
          description: Zły lub wygasły state
        '403':
          description: Brak wymaganej roli/członkostwa
        '502':
          description: Błąd Discorda
  /auth/demo:
    post:
      tags: [Auth]
      summary: Logowanie demo (gdy ALLOW_DEMO_LOGIN=true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                remember:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Sesja demo
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  redirect: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          description: Demo wyłączone
        '429':
          description: Rate limit
  /auth/logout:
    post:
      tags: [Auth]
      summary: Wyloguj
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Sesja usunięta
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/wearables:
    get:
      tags: [API]
      summary: Urządzenia, metryki i gotowość
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Stan urządzeń i gotowości
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WearablesState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/wearables/{provider}/sync:
    post:
      tags: [API]
      summary: Ręczna synchronizacja urządzenia
      security:
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [apple, oura]
      responses:
        '200':
          description: Synchronizacja zakończona
        '403':
          $ref: '#/components/responses/BadRequest'
        '502':
          description: Błąd dostawcy
  /api/wearables/{provider}:
    delete:
      tags: [API]
      summary: Odłączenie urządzenia i usunięcie danych zdrowotnych
      security:
        - cookieAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [apple, oura]
      responses:
        '200':
          description: Odłączono
        '404':
          description: Brak połączenia
  /api/wearables/apple/pair:
    post:
      tags: [API]
      summary: Kod parowania Apple Watch
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Kod jednorazowy
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
  /api/wearables/apple/ingest:
    post:
      tags: [API]
      summary: Ingest danych Apple Health
      description: Autoryzacja kodem parowania (pierwsze żądanie) albo Bearer deviceToken.
      responses:
        '200':
          description: Zapisano dni
        '401':
          description: Zły kod lub token

  /api/quotes:
    get:
      tags: [API]
      summary: Notowania rynkowe z cache i fallbackiem
      responses:
        '200':
          description: Zawsze 200; pole stale mowi o pochodzeniu danych
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotes'
  /api/macro-events:
    get:
      tags: [API]
      summary: Kalendarz makro z MySQL
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Publikacje makro + stan synchronizacji
          content:
            application/json:
              schema:
                type: object
                required: [events, sync]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/MacroEvent'
                  sync:
                    $ref: '#/components/schemas/MacroSync'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/mcp:
    get:
      tags: [API]
      summary: Panel MCP — status, scope i oczekujące propozycje
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Propozycje pending, audyt i informacje o scope
          content:
            application/json:
              schema:
                type: object
                required: [endpoint, enabled, writesEnabled, scopes, proposals, proposalCount, audit]
                properties:
                  endpoint:
                    type: string
                  enabled:
                    type: boolean
                  writesEnabled:
                    type: boolean
                  scopes:
                    type: array
                    items:
                      type: string
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/McpProposal'
                  proposalCount:
                    type: integer
                  audit:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/mcp/proposals/decide:
    post:
      tags: [API]
      summary: Zatwierdzenie lub odrzucenie propozycji MCP w panelu
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, action]
              properties:
                id:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum: [approve, reject]
      responses:
        '200':
          description: Decyzja zapisana
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Konflikt rewizji, wygasła lub zamknięta propozycja

  /api/mcp/proposals/{id}/approval-code:
    post:
      tags: [API]
      summary: Jednorazowy kod do zatwierdzenia propozycji w rozmowie
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Kod jednorazowy (TTL 10 min)
          content:
            application/json:
              schema:
                type: object
                required: [proposalId, code, expiresAt]
                properties:
                  proposalId:
                    type: string
                  code:
                    type: string
                    pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
                  expiresAt:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Propozycja wygasła lub została rozstrzygnięta

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: av_session
  responses:
    Unauthorized:
      description: Brak sesji
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Nieprawidłowe żądanie
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        revision: { type: integer }
        bytes: { type: integer }
        limit: { type: integer }
        userId: { type: integer }
    McpProposal:
      type: object
      required: [proposalId, kind, target, status, diffHash, canApprove]
      properties:
        proposalId: { type: string }
        kind:
          type: string
          enum: [manual_trade, close_trade, trade_review, day_plan, checkin, setup, prop_challenge, account, capital_flow]
        target: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        baseRevision: { type: integer }
        diffHash: { type: string }
        changes:
          type: array
          items: { type: string }
        before: { type: object, nullable: true }
        after: { type: object, nullable: true }
        diff:
          type: array
          items: { type: object }
        createdAt: { type: string }
        expiresAt: { type: string }
        decidedAt: { type: string, nullable: true }
        clientName: { type: string }
        canApprove: { type: boolean }
        approvalCodeActive: { type: boolean }
        approvalCodeExpiresAt: { type: string, nullable: true }
    Health:
      type: object
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
        uptime: { type: integer }
        now: { type: string, format: date-time }
        roleCheckConfigured: { type: boolean }
        roleRecheckConfigured: { type: boolean }
        roleRecheck:
          type: object
          properties:
            configured: { type: boolean }
            intervalSeconds: { type: integer }
            status: { type: string, enum: [success, partial, error, never, skipped] }
            lastAttemptAt: { type: [string, 'null'] }
            lastSuccessAt: { type: [string, 'null'] }
            lastError: { type: [string, 'null'] }
            checked: { type: integer }
            revoked: { type: integer }
            errors: { type: integer }
            stale: { type: boolean }
        db:
          type: object
          properties:
            ok: { type: boolean }
            version: { type: string }
            latencyMs: { type: integer }
    Quotes:
      type: object
      required: [quotes, updatedAt, stale]
      properties:
        quotes:
          type: array
          items:
            type: object
            required: [symbol, price, changePercent]
            properties:
              symbol: { type: string }
              price: { type: number }
              changePercent: { type: [number, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
        stale: { type: boolean }
    Subscription:
      type: object
      properties:
        plan: { type: string, enum: [solo, full] }
        accessUntil: { type: [string, 'null'], format: date }
        expired: { type: boolean }
        roleVerified: { type: boolean }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        globalName: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        isDemo: { type: boolean }
        subscription:
          $ref: '#/components/schemas/Subscription'
    Me:
      type: object
      properties:
        authenticated: { type: boolean }
        discordConfigured: { type: boolean }
        roleCheckConfigured: { type: boolean }
        roleRecheckConfigured: { type: boolean }
        roleRecheckSeconds: { type: integer }
        demoAllowed: { type: boolean }
        db: { type: string }
        user:
          $ref: '#/components/schemas/User'
    StateEnvelope:
      type: object
      properties:
        state:
          type: [object, 'null']
          additionalProperties: true
        revision: { type: integer }
        bytes: { type: integer }
        updatedAt: { type: [string, 'null'] }
        userId: { type: integer }
    StatePutRequest:
      type: object
      required: [state, baseRevision]
      properties:
        state:
          type: object
          additionalProperties: true
        baseRevision:
          type: integer
          minimum: 0
        ownerId:
          type: integer
          minimum: 1
          description: ID zalogowanego użytkownika; niezgodne z sesją daje 409 session_changed.
    StatePutResponse:
      type: object
      properties:
        ok: { type: boolean }
        revision: { type: integer }
        bytes: { type: integer }
        updatedAt: { type: string, format: date-time }
        userId: { type: integer }
    WearablesState:
      type: object
      properties:
        devices:
          type: object
          additionalProperties:
            type: object
            properties:
              provider: { type: string }
              label: { type: string }
              configured: { type: boolean }
              canConnect: { type: boolean }
              connected: { type: boolean }
              oauthConnected: { type: boolean }
              dataReady: { type: boolean }
              status:
                type: string
                enum: [not_configured, ready_to_connect, pending_authorization, connected, syncing, sync_error, token_expired, revoked, awaiting_provider_access, awaiting_provider_spec]
              lastSyncAt: { type: [string, 'null'], format: date-time }
              lastSyncStatus: { type: [string, 'null'] }
              lastError: { type: [string, 'null'] }
        today:
          type: object
          nullable: true
          properties:
            date: { type: string, format: date }
            sleepMinutes: { type: [integer, 'null'] }
            hrvMs: { type: [number, 'null'] }
            restingHr: { type: [integer, 'null'] }
            bodyBattery: { type: [integer, 'null'] }
            providerScore: { type: [integer, 'null'] }
            readiness: { type: [integer, 'null'] }
        baseline:
          type: object
          properties:
            days: { type: integer }
            sleepMinutes: { type: [number, 'null'] }
            hrvMs: { type: [number, 'null'] }
            restingHr: { type: [number, 'null'] }
        series:
          type: array
          items:
            type: object
            additionalProperties: true
        readiness:
          type: object
          properties:
            score: { type: [integer, 'null'] }
            title: { type: string }
            class: { type: string }
            source: { type: string }
            components:
              type: object
              additionalProperties: true
    MacroEvent:
      type: object
      required: [id, source, name, currency, impact, startAt, startIso]
      properties:
        id: { type: string }
        source: { type: string, enum: [forexfactory, tradingview] }
        name: { type: string }
        description: { type: string }
        currency: { type: string }
        impact: { type: integer, enum: [2, 3] }
        startAt: { type: string, format: date-time }
        startIso: { type: string }
        forecast: { type: string }
        previous: { type: string }
    MacroSync:
      type: object
      required: [status, lastSuccessAt, eventsCount, stale]
      properties:
        status: { type: string, enum: [never, running, success, partial, error] }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        eventsCount: { type: integer }
        stale: { type: boolean }
