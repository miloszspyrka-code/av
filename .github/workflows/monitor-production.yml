name: Monitor production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-production
  cancel-in-progress: true

jobs:
  health:
    name: Health + Discord sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check public health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 25 https://alphavault.pl/api/health)"
          echo "$body" | jq .

          echo "$body" | jq -e '
            .ok == true and
            .db.ok == true and
            .discordConfigured == true and
            .roleCheckConfigured == true and
            .eventsConfigured == true and
            .demoAllowed == false and
            .sync.status == "success" and
            .sync.stale == false
          ' >/dev/null

          echo "Production health and Discord sync are OK."

      - name: Check UI
        run: |
          set -euo pipefail
          page="$(curl -fsS --max-time 25 https://alphavault.pl/)"
          case "$page" in
            *"Alpha Vault"*) ;;
            *)
              echo "UI does not contain Alpha Vault."
              exit 1
              ;;
          esac
          echo "UI responds with Alpha Vault."

      - name: Check MCP health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 25 https://mcp.alphavault.pl/health)"
          echo "$body" | jq .
          echo "$body" | jq -e '
            .ok == true and
            .db.ok == true and
            .mcp.enabled == true and
            .mcp.writesEnabled == false and
            .mcp.resource == "https://mcp.alphavault.pl/mcp"
          ' >/dev/null
          echo "MCP health is OK."

      - name: Check MCP OAuth discovery
        run: |
          set -euo pipefail
          prm="$(curl -fsS --max-time 25 https://mcp.alphavault.pl/.well-known/oauth-protected-resource)"
          echo "$prm" | jq -e '
            .resource == "https://mcp.alphavault.pl/mcp" and
            (.authorization_servers | index("https://mcp.alphavault.pl")) != null and
            (.scopes_supported | index("alphavault.read")) != null
          ' >/dev/null
          as="$(curl -fsS --max-time 25 https://mcp.alphavault.pl/.well-known/oauth-authorization-server)"
          echo "$as" | jq -e '
            .issuer == "https://mcp.alphavault.pl" and
            .registration_endpoint == "https://mcp.alphavault.pl/oauth/register" and
            (.code_challenge_methods_supported | index("S256")) != null
          ' >/dev/null
          curl -fsS --max-time 25 https://mcp.alphavault.pl/oauth/jwks.json | jq -e '.keys[0].kty == "RSA"' >/dev/null
          echo "MCP OAuth discovery is OK."

      - name: Check MCP unauthenticated challenge
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          status="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' --max-time 25 \
            -X POST https://mcp.alphavault.pl/mcp \
            -H 'Content-Type: application/json' \
            -d '{}')"
          [ "$status" = "401" ] || { echo "MCP returned $status, expected 401"; exit 1; }
          grep -qi '^www-authenticate: Bearer ' "$headers" || { echo "Missing WWW-Authenticate"; exit 1; }
          echo "MCP auth challenge is OK."
