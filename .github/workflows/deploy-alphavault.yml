name: Deploy AlphaVault

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - show changes without writing to the server"
        type: boolean
        default: true
      rollback:
        description: "Restore the latest backup instead of deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-alphavault-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy AlphaVault to alphavault.pl
    runs-on: ubuntu-latest
    environment: alphavault-production
    timeout-minutes: 30
    # Deploy tylko dla CI wywołanego pushem do main w tym repo.
    # Wyklucza runy pull_request (w tym forki z gałęzią o nazwie "main"),
    # które nie mogą wdrażać niezweryfikowanego kodu na produkcję.
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && vars.DEPLOY_ENABLED == 'true')
      || (github.event_name == 'workflow_dispatch'
      && (vars.DEPLOY_ENABLED == 'true' || inputs.dry_run == true))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, curl, mbstring
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate required secrets
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          LH_SSH_PRIVATE_KEY: ${{ secrets.LH_SSH_PRIVATE_KEY }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
          LH_DEPLOY_PATH: ${{ secrets.LH_DEPLOY_PATH }}
          LH_APP_PATH: ${{ secrets.LH_APP_PATH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_REQUIRED_ROLE_ID: ${{ secrets.DISCORD_REQUIRED_ROLE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          INTEGRATIONS_KEY: ${{ secrets.INTEGRATIONS_KEY }}
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in LH_SSH_HOST LH_SSH_USER LH_SSH_PRIVATE_KEY LH_SSH_KNOWN_HOSTS LH_DEPLOY_PATH LH_APP_PATH SESSION_SECRET DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_REDIRECT_URI DISCORD_GUILD_ID DISCORD_REQUIRED_ROLE_ID DISCORD_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the missing secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ "${DISCORD_REDIRECT_URI}" != "https://alphavault.pl/auth/discord/callback" ]; then
            echo "::error::DISCORD_REDIRECT_URI must be https://alphavault.pl/auth/discord/callback"
            exit 1
          fi
          echo "Secret validation passed."

      - name: Prepare SSH material
        env:
          LH_SSH_PRIVATE_KEY: ${{ secrets.LH_SSH_PRIVATE_KEY }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/lh_deploy_key
          chmod 600 ~/.ssh/lh_deploy_key
          printf '%s\n' "$LH_SSH_KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/lh_known_hosts
          chmod 600 ~/.ssh/lh_known_hosts
          ssh-keygen -y -P "" -f ~/.ssh/lh_deploy_key > /dev/null
          echo "SSH material prepared."

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find app public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT || '40022' }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          LH_SSH_PRIVATE_KEY_PATH: /home/runner/.ssh/lh_deploy_key
          LH_SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/lh_known_hosts
          LH_DEPLOY_PATH: ${{ secrets.LH_DEPLOY_PATH }}
          LH_APP_PATH: ${{ secrets.LH_APP_PATH }}
          APP_URL: ${{ vars.APP_URL || 'https://alphavault.pl' }}
          APP_ENV: production
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_REQUIRED_ROLE_ID: ${{ secrets.DISCORD_REQUIRED_ROLE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ADMIN_DISCORD_IDS: ${{ vars.ADMIN_DISCORD_IDS }}
          DISCORD_DEFAULT_PLAN: full
          DISCORD_TRIAL_DAYS: "0"
          ALLOW_DEMO_LOGIN: "false"
          MAX_STATE_BYTES: "12582912"
          WEARABLES_ENCRYPTION_KEY: ${{ secrets.WEARABLES_ENCRYPTION_KEY }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          GARMIN_AUTHORIZE_URL: ${{ vars.GARMIN_AUTHORIZE_URL }}
          GARMIN_TOKEN_URL: ${{ vars.GARMIN_TOKEN_URL }}
          GARMIN_API_BASE: ${{ vars.GARMIN_API_BASE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
          ROLLBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-alphavault.sh
          ./scripts/deploy-alphavault.sh
