name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP + API + UI
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: alpha_vault
          MYSQL_USER: alpha_vault
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, curl, mbstring
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Documentation
        run: |
          node scripts/sync-docs.mjs --check
          node tests/docs.test.mjs

      - name: Encoding guard
        run: npm run test:encoding

      - name: Router unit tests
        run: npm run test:router

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find app public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Create test configuration
        run: |
          cat > tests/config.test.json <<'JSON'
          {
            "APP_URL": "http://127.0.0.1:4173",
            "APP_ENV": "local",
            "SESSION_SECRET": "ci-test-session-secret-0123456789abcdef",
            "DB_HOST": "127.0.0.1",
            "DB_PORT": "3306",
            "DB_NAME": "alpha_vault",
            "DB_USER": "alpha_vault",
            "DB_PASSWORD": "test",
            "DISCORD_CLIENT_ID": "",
            "DISCORD_CLIENT_SECRET": "",
            "DISCORD_REDIRECT_URI": "http://127.0.0.1:4173/auth/discord/callback",
            "DISCORD_GUILD_ID": "123456789012345678",
            "DISCORD_REQUIRED_ROLE_ID": "test-role",
            "DISCORD_BOT_TOKEN": "test-bot-token",
            "ADMIN_DISCORD_IDS": "admin-test",
            "DISCORD_DEFAULT_PLAN": "full",
            "DISCORD_TRIAL_DAYS": "0",
            "ALLOW_DEMO_LOGIN": "true",
            "MAX_STATE_BYTES": "12582912"
          }
          JSON

      - name: Apply database schema
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
        run: php app/db/migrate.php

      - name: Role recheck tests
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
        run: npm run test:roles

      - name: Discord events tests
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
        run: php tests/discord-events.test.php

      - name: Macro events tests
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
        run: php tests/macro-events.test.php

      - name: Prop engine tests
        run: node tests/prop.unit.mjs

      - name: Quotes tests
        run: |
          php tests/quotes.test.php
          node tests/quotes.e2e.mjs

      - name: Wearables E2E
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/wearables.e2e.mjs

      - name: Start PHP server
        run: |
          set -euo pipefail
          ALPHA_VAULT_CONFIG=tests/config.test.json php -S 127.0.0.1:4173 -t public public/router.php > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/php-server.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null 2>&1; then
              echo "PHP server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "PHP server did not become ready."
          cat /tmp/php-server.log
          exit 1

      - name: API E2E
        env:
          APP_URL: http://127.0.0.1:4173
        run: |
          ALPHA_VAULT_CONFIG=tests/config.test.json php tests/seed-macro-events.php
          node tests/api.e2e.mjs

      - name: Seed Discord events for UI
        env:
          ALPHA_VAULT_CONFIG: tests/config.test.json
        run: php tests/seed-discord-events.php

      - name: UI E2E
        env:
          APP_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ui.e2e.mjs

      - name: Tax E2E
        env:
          APP_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/tax.e2e.mjs

      - name: PWA E2E (iPhone emulation)
        env:
          APP_URL: http://127.0.0.1:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/pwa.e2e.mjs

      - name: Start empty-events PHP server
        run: |
          set -euo pipefail
          APP_URL=http://127.0.0.1:4174 DISCORD_GUILD_ID=empty-guild ALPHA_VAULT_CONFIG=tests/config.test.json \
            php -S 127.0.0.1:4174 -t public public/router.php > /tmp/php-server-empty.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/api/health >/dev/null 2>&1; then
              echo "Empty-events PHP server is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/php-server-empty.log
          exit 1

      - name: UI empty-state E2E
        env:
          APP_URL: http://127.0.0.1:4174
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ui-empty.e2e.mjs

      - name: Create integrations test configuration
        run: |
          node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync("tests/config.test.json", "utf8"));
            Object.assign(config, {
              APP_URL: "http://127.0.0.1:4175",
              INTEGRATIONS_KEY: "ci-integrations-key-0123456789abcdef0123456789abcdef",
              METAAPI_TOKEN: "test-metaapi-token",
              OKX_BASE: "http://127.0.0.1:4191/okx",
              BINGX_BASE: "http://127.0.0.1:4191/bingx",
              WEEX_SPOT_BASE: "http://127.0.0.1:4191/weex",
              WEEX_FUTURES_BASE: "http://127.0.0.1:4191/weex",
              METAAPI_BASE: "http://127.0.0.1:4191/metaapi",
              METAAPI_CLIENT_BASE: "http://127.0.0.1:4191/metaapi-client"
            });
            fs.writeFileSync("tests/config.integrations.json", JSON.stringify(config, null, 2));
          '

      - name: Integrations API E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/integrations.e2e.mjs

      - name: Integrations UI E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/ui-integrations.e2e.mjs

      - name: Upload PHP server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: |
            /tmp/php-server.log
            /tmp/php-server-empty.log
          retention-days: 3
